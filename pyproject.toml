[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcanum-db"
version = "0.1.0"
description = "A relational database built from scratch, with a live view of its internals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["arcanum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
