[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcanum-db"
version = "0.1.0"
description = "A relational database built from scratch, with a live view of its internals."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "arcanum-db[server]"]

[tool.setuptools.packages.find]
include = ["arcanum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
